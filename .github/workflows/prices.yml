name: aktier-priser

on:
  # Schemaläggning sker externt på cron-job.org (GitHubs inbyggda schedule var
  # för opålitlig), tidszon Europe/Stockholm:
  #   - var 5:e minut vardagar 9:00–21:55  (*/5 9-21 * * 1-5)
  #     = Stockholmsbörsen + USA-börserna (15:30–22:00, 14:30–21:00 när
  #       sommartidsbytet skiljer mellan USA och Europa)
  #   - en gång i timmen övrig tid          (0 0-8,18-23 * * *) – 22:00/23:00
  #     fångar USA:s stängningskurs
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Hämta ~1 års historik (annars bara senaste kurser)'
        type: boolean
        default: false

concurrency:
  group: aktier-priser
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r prices/requirements.txt
      - name: Hämta kurser
        run: python prices/fetch_prices.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKFILL: ${{ github.event.inputs.backfill }}